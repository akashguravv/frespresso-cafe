<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Frespresso — Site header</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="../assets/frespresso.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<header class="fx-header {{scrolledCls}}" style="font-family: Inter, system-ui, sans-serif; color: #1E1E1E">
  <div class="fx-wrap fx-header__in">
    <a class="fx-header__logo" href="Home.dc.html" aria-label="Frespresso Cafe &amp; Resto, home">
      <span class="fx-logo-h"><dc-import name="Logo" variant="horizontal" tone="color" size="{{logoSize}}" hint-size="230px,48px"></dc-import></span>
      <span class="fx-logo-i"><dc-import name="Logo" variant="icon" tone="color" size="40" hint-size="40px,40px"></dc-import></span>
    </a>
    <nav class="fx-nav" aria-label="Main">
      <sc-for list="{{nav}}" as="item" hint-placeholder-count="7">
        <a href="{{item.href}}" class="{{item.cls}}">{{item.label}}</a>
      </sc-for>
    </nav>
    <div class="fx-header__actions">
      <a class="fx-btn fx-btn--accent fx-btn--sm fx-header__cta" href="#swiggy">Order on Swiggy</a>
      <button class="fx-iconbtn fx-burger" type="button" aria-label="Open menu" aria-expanded="{{openStr}}" onClick="{{openDrawer}}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"></path></svg>
      </button>
    </div>
  </div>
  <sc-if value="{{open}}" hint-placeholder-val="{{ false }}">
    <div class="fx-scrim" onClick="{{closeDrawer}}"></div>
    <aside class="fx-drawer" aria-label="Site menu">
      <div class="fx-drawer__top">
        <dc-import name="Logo" variant="horizontal" tone="color" size="40" hint-size="190px,40px"></dc-import>
        <button class="fx-iconbtn" type="button" aria-label="Close menu" onClick="{{closeDrawer}}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </button>
      </div>
      <nav class="fx-drawer__nav" aria-label="Mobile">
        <sc-for list="{{nav}}" as="item" hint-placeholder-count="7">
          <a href="{{item.href}}" class="{{item.cls}}">{{item.label}}<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
        </sc-for>
      </nav>
      <div class="fx-drawer__foot">
        <a class="fx-btn fx-btn--primary fx-btn--block" href="tel:+917887323311"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"></path></svg>Call +91 788 732 3311</a>
        <a class="fx-btn fx-btn--accent fx-btn--block" href="#swiggy">Order on Swiggy</a>
        <p class="fx-small" style="text-align: center">@frespressosolapur</p>
      </div>
    </aside>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","about","menu","experience","gallery","reviews","contact"],"default":"home"},"scrolled":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":100}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { open: false }; }
  renderVals() {
    const active = this.props.active ?? 'home';
    const scrolled = this.props.scrolled === true || this.props.scrolled === 'true';
    const pages = [
      ['home', 'Home', 'Home.dc.html'], ['about', 'About', 'About.dc.html'], ['menu', 'Menu', 'Menu.dc.html'],
      ['experience', 'Experience', 'Experience.dc.html'], ['gallery', 'Gallery', 'Gallery.dc.html'],
      ['reviews', 'Reviews', 'Reviews.dc.html'], ['contact', 'Contact', 'Contact.dc.html']
    ];
    return {
      nav: pages.map(([id, label, href]) => ({ label, href, cls: id === active ? 'is-active' : '' })),
      scrolledCls: scrolled ? 'is-scrolled' : '',
      logoSize: scrolled ? 40 : 48,
      open: !!this.state.open,
      openStr: this.state.open ? 'true' : 'false',
      openDrawer: () => this.setState({ open: true }),
      closeDrawer: () => this.setState({ open: false })
    };
  }
}
</script>
</body>
</html>

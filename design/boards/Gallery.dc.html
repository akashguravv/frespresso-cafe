<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Frespresso — Gallery</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="../assets/frespresso.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="fx-page" style="font-family: Inter, system-ui, sans-serif; color: #1E1E1E; background: #FAF3E7">
<dc-import name="Header" active="gallery" hint-size="100%,92px"></dc-import>
<main id="main">
<section class="fx-pagehero" data-motion="hero-in"><div class="fx-wrap"><div class="fx-pagehero__in">
<nav class="fx-crumbs" aria-label="Breadcrumb"><a href="Home.dc.html">Home</a><span aria-hidden="true">/</span><span aria-current="page">Gallery</span></nav>
<p class="fx-eyebrow">Gallery</p><h1 class="fx-h1">A peek <em>inside</em></h1><p class="fx-lead">Cozy corners, steaming cups and game nights. Tap any photo to view it larger.</p></div></div></section>
<section aria-label="Photo gallery" style="padding-bottom:96px">
  <div class="fx-wrap">
    <div class="fx-chips" role="tablist" aria-label="Filter photos" style="margin-bottom:32px">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="6">
        <button class="fx-chip {{c.cls}}" type="button" role="tab" aria-selected="{{c.sel}}" onClick="{{c.pick}}">{{c.label}}</button>
      </sc-for>
    </div>
    <div class="fx-gallery">
      <sc-for list="{{tiles}}" as="t" hint-placeholder-count="12">
        <button class="fx-tile {{t.cls}}" type="button" aria-label="Open photo: {{t.label}}" onClick="{{t.open}}" data-motion="reveal-up">
          <div class="ph {{t.ph}}" role="img" aria-label="Placeholder: {{t.label}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"></rect><circle cx="9" cy="9" r="2"></circle><path d="M21 15l-5-5L5 21"></path></svg><span>{{t.label}}</span></div>
          <span class="fx-tile__cap">{{t.label}} <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:18px;height:18px"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"></path></svg></span>
        </button>
      </sc-for>
    </div>
  </div>
</section>
<section class="fx-section--tight" aria-labelledby="ig2" style="padding-top:0">
  <div class="fx-wrap"><div class="fx-cta-band fx-bg-green">
    <div style="display:flex;flex-direction:column;gap:12px;max-width:560px"><p class="fx-eyebrow">@frespressosolapur</p><h2 id="ig2" class="fx-h2">More moments on Instagram</h2></div>
    <a class="fx-btn fx-btn--light" href="https://instagram.com/frespressosolapur"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><path d="M17.5 6.5h.01"></path></svg>Follow us</a>
  </div></div>
</section>
<sc-if value="{{lbOpen}}" hint-placeholder-val="{{ false }}">
  <div class="fx-lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
    <button class="fx-iconbtn fx-iconbtn--dark fx-lightbox__close" type="button" aria-label="Close" onClick="{{close}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    <button class="fx-iconbtn fx-iconbtn--dark fx-lightbox__prev" type="button" aria-label="Previous photo" onClick="{{prev}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
    <div class="fx-lightbox__img"><div class="ph ph--dark" role="img" aria-label="Placeholder: {{lb.label}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"></rect><circle cx="9" cy="9" r="2"></circle><path d="M21 15l-5-5L5 21"></path></svg><span>{{lb.label}}</span></div></div>
    <button class="fx-iconbtn fx-iconbtn--dark fx-lightbox__next" type="button" aria-label="Next photo" onClick="{{next}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
    <div class="fx-lightbox__cap"><span>{{lb.label}}</span><span style="opacity:.7">{{lb.pos}}</span></div>
  </div>
</sc-if>

</main>
<dc-import name="Footer" hint-size="100%,560px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1440, "height": 3000}}'>
const PHOTOS = [{"label": "Interior photo", "cat": "interior", "cls": "is-tall", "ph": ""}, {"label": "Cafe Mocha", "cat": "coffee", "cls": "", "ph": "ph--caramel"}, {"label": "Board games", "cat": "games", "cls": "", "ph": "ph--green"}, {"label": "Naughty Nutella Waffle", "cat": "desserts", "cls": "is-wide", "ph": "ph--caramel"}, {"label": "Seating area", "cat": "interior", "cls": "", "ph": ""}, {"label": "Guitar corner", "cat": "games", "cls": "is-tall", "ph": "ph--green"}, {"label": "Peri Peri Fries", "cat": "food", "cls": "", "ph": ""}, {"label": "Frappe Frespresso", "cat": "coffee", "cls": "", "ph": "ph--caramel"}, {"label": "Brownie Sunrise Sundae", "cat": "desserts", "cls": "", "ph": "ph--caramel"}, {"label": "Cheese Garlic Bread", "cat": "food", "cls": "is-wide", "ph": ""}, {"label": "Book shelf", "cat": "games", "cls": "", "ph": "ph--green"}, {"label": "Tandoori Paneer Sandwich", "cat": "food", "cls": "", "ph": ""}];
const FILTERS = [{"id": "all", "label": "All"}, {"id": "interior", "label": "Interior"}, {"id": "coffee", "label": "Coffee"}, {"id": "food", "label": "Food"}, {"id": "desserts", "label": "Desserts"}, {"id": "games", "label": "Games & music"}];
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { f: 'all', i: -1 }; }
  renderVals() {
    const f = this.state.f;
    const list = PHOTOS.filter((p) => f === 'all' || p.cat === f);
    const i = this.state.i;
    const n = list.length;
    const cur = i >= 0 && i < n ? list[i] : null;
    return {
      chips: FILTERS.map((c) => ({ label: c.label, cls: c.id === f ? 'is-active' : '', sel: c.id === f ? 'true' : 'false', pick: () => this.setState({ f: c.id, i: -1 }) })),
      tiles: list.map((p, k) => ({ ...p, cls: f === 'all' ? p.cls : '', open: () => this.setState({ i: k }) })),
      lbOpen: !!cur,
      lb: cur ? { label: cur.label, pos: (i + 1) + ' / ' + n } : { label: '', pos: '' },
      close: () => this.setState({ i: -1 }),
      prev: () => this.setState({ i: (i - 1 + n) % n }),
      next: () => this.setState({ i: (i + 1) % n })
    };
  }
}
</script>
</body>
</html>
